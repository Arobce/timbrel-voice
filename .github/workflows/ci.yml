name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks run this too once the repo is public: read-only.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline, no audio devices)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
